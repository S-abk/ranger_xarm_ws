# Controllers for the 4WIS base joints declared by ranger_wheels.xacro.
#
# These are plain forward-command controllers, not a steering controller from
# steering_controllers_library: every controller in that library assumes a
# fixed rear axle, which is exactly the assumption a four-wheel-steer platform
# breaks. ranger_4wis_controller.py does the inverse kinematics and writes
# into these two.
#
# Joint order is load bearing. It has to match the CORNERS tuple in
# ranger_4wis_controller.py, because Float64MultiArray carries no names.
controller_manager:
  ros__parameters:
    ranger_steer_controller:
      type: position_controllers/JointGroupPositionController
    ranger_wheel_controller:
      type: effort_controllers/JointGroupEffortController

ranger_steer_controller:
  ros__parameters:
    joints:
      - front_left_steer_joint
      - front_right_steer_joint
      - rear_left_steer_joint
      - rear_right_steer_joint

ranger_wheel_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
